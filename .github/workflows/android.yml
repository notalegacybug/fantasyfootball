# Builds the Android app on GitHub's machines (the dev PC can't install a JDK or the
# Android SDK) and publishes the APK as the newest GitHub Release, so this link always
# serves the latest build:
#   https://github.com/notalegacybug/fantasyfootball/releases/latest/download/roster-optimizer.apk
name: android

on:
  push:
    branches: [main, in-season-m1]
    paths: ["app/**", "fixtures/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write          # create the release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}   # Play needs a higher number on every upload
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests (answer key, ESPN parser, bye weeks)
        run: node --test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Vendor @capacitor/core for the no-bundler web code
        run: mkdir -p www/vendor && cp node_modules/@capacitor/core/dist/index.js www/vendor/capacitor-core.js

      - name: Generate and patch the Android project
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk roster-optimizer.apk

      # Google Play upload. The secrets reach only this step; the keystore is written to the
      # runner's temp dir (wiped after the job) and never committed or attached to a release.
      - name: Build signed release bundle (Google Play)
        working-directory: app/android
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
        run: |
          export UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.p12"
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$UPLOAD_KEYSTORE"
          ./gradlew bundleRelease --no-daemon
          rm -f "$UPLOAD_KEYSTORE"

      - name: Name and check the bundle
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab roster-optimizer.aab
          jarsigner -verify roster-optimizer.aab | grep -q "jar verified" || { echo "AAB is not signed"; exit 1; }

      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: RosterOptimizer test build ${{ github.run_number }}
          make_latest: true
          files: |
            app/roster-optimizer.apk
            app/roster-optimizer.aab
          body: |
            Test build from ${{ github.ref_name }} @ ${{ github.sha }}, version code ${{ github.run_number }}.
            roster-optimizer.apk is debug-signed: to update, uninstall the previous version first, then install this one.
            roster-optimizer.aab is signed with the Play upload key: upload it in Play Console, don't install it.
