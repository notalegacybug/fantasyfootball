<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft board</title>
<style>
:root{
  --ink:#0d1b1e; --panel:#14262a; --panel2:#0f2024;
  --rule:#24403f; --chalk:#e8e4d9; --dim:#8fa39f;
  --signal:#f0a830; --alarm:#c85a3c; --ok:#5fa88a;
  --num: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --sans: "Inter", -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--chalk);font-family:var(--sans);
     font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* clock strip ---------------------------------------------------------- */
#clock{display:flex;align-items:baseline;gap:28px;padding:14px 22px;
       background:var(--panel2);border-bottom:2px solid var(--rule)}
#clock.mine{border-bottom-color:var(--signal);background:#1b2b21}
#pickno{font-family:var(--num);font-size:30px;font-weight:600;letter-spacing:-.02em}
#turn{font-size:17px;font-weight:600}
#turn.mine{color:var(--signal)}
#clock .meta{color:var(--dim);font-size:13px}

/* best-by-category strip: the glance-only view, no reading required ------ */
#category{display:flex;padding:9px 22px;background:var(--panel2);
          border-bottom:2px solid var(--rule);overflow-x:auto}
.catchip{display:flex;flex-direction:column;gap:2px;padding:4px 18px;
         border-right:1px solid var(--rule);white-space:nowrap}
.catchip:first-child{padding-left:0}
.catchip:last-child{border-right:none}
.catchip .cpos{font-size:10px;color:var(--dim);font-weight:700;letter-spacing:.06em}
.catchip .cname{font-size:14px;font-weight:600}
.catchip .cval{font-family:var(--num);font-size:12px;color:var(--ok)}

/* layout --------------------------------------------------------------- */
main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
     gap:0;align-items:start}
section{padding:18px 22px;min-width:0}
section + section{border-left:1px solid var(--rule)}
h2{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--dim);
   margin:0 0 12px;font-variant:small-caps}

/* recommendations ------------------------------------------------------ */
.rec{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:baseline;
     padding:9px 0;border-bottom:1px solid var(--rule)}
.rec:first-of-type .who{font-size:23px;color:var(--signal)}
.rec:first-of-type .v{font-size:23px;color:var(--signal)}
.who{font-size:17px;font-weight:600}
.sub{grid-column:1;color:var(--dim);font-size:12.5px}
.v{font-family:var(--num);font-size:17px;font-weight:600;text-align:right}
.vlabel{grid-column:2;color:var(--dim);font-size:11px;text-align:right}

/* cost of waiting: the signature element -------------------------------- */
.wait{padding:11px 0;border-bottom:1px solid var(--rule)}
.wrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.wpos{font-weight:700;font-size:15px;width:40px}
.wcost{font-family:var(--num);font-size:16px;font-weight:600}
.bar{height:7px;background:var(--panel);margin:7px 0 5px;position:relative}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.hot i{background:var(--alarm)}
.bar.cliff::after{content:"";position:absolute;top:-3px;bottom:-3px;
                  width:2px;background:var(--signal)}
.wdetail{color:var(--dim);font-size:12.5px}
.cliffnote{color:var(--signal);font-size:12px;margin-top:3px}
#trend{padding:9px 0 4px}
.runhot{color:var(--signal);font-weight:600}
.pickable{cursor:pointer}
.pickable:hover{background:var(--panel)}
.catchip.pickable:hover{background:var(--panel2);filter:brightness(1.3)}

/* search + board -------------------------------------------------------- */
#searchwrap{padding:14px 22px;border-top:1px solid var(--rule);
            border-bottom:1px solid var(--rule);background:var(--panel2)}
#q{width:100%;background:transparent;border:none;border-bottom:2px solid var(--rule);
   color:var(--chalk);font-family:var(--sans);font-size:20px;padding:7px 0;outline:none}
#q:focus{border-bottom-color:var(--signal)}
#hint{color:var(--dim);font-size:12px;margin-top:7px}
#hint b{color:var(--chalk);font-weight:600}
#results div{padding:7px 0;border-bottom:1px solid var(--rule);cursor:pointer;
             display:flex;justify-content:space-between;gap:12px}
#results div.sel{color:var(--signal)}
#results div:hover{color:var(--signal)}

#tabs{display:flex;gap:2px;padding:0 22px;margin-top:14px}
#tabs button{background:none;border:none;border-bottom:2px solid transparent;
             color:var(--dim);font-family:var(--sans);font-size:13px;font-weight:600;
             padding:7px 12px;cursor:pointer}
#tabs button.on{color:var(--chalk);border-bottom-color:var(--signal)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:5px 10px;text-align:left}
th{color:var(--dim);font-size:11px;font-weight:600;font-variant:small-caps;
   border-bottom:1px solid var(--rule)}
td.n{font-family:var(--num);text-align:right;font-variant-numeric:tabular-nums}
tr.tierbreak td{border-top:2px solid var(--signal)}
tr:hover{background:var(--panel)}
.taken{color:var(--dim);text-decoration:line-through}
#flash{position:fixed;bottom:18px;right:18px;background:var(--signal);color:var(--ink);
       padding:9px 16px;font-weight:600;opacity:0;pointer-events:none}
#flash.on{opacity:1}
@media (prefers-reduced-motion:no-preference){#flash{transition:opacity .18s}}
@media (max-width:820px){main{grid-template-columns:1fr}
  section + section{border-left:none;border-top:1px solid var(--rule)}}
</style>
</head>
<body>

<div id="clock">
  <span id="pickno">--</span>
  <span id="turn">loading</span>
  <span class="meta" id="meta"></span>
</div>

<div id="category"></div>

<div id="searchwrap">
  <input id="q" autocomplete="off" spellcheck="false" placeholder="Type a name as picks come in">
  <div id="hint"><b>Enter</b>/<b>click</b> someone else took him &nbsp;·&nbsp;
    <b>Shift+Enter</b>/<b>Shift+click</b> I took him
    &nbsp;·&nbsp; <b>↑↓</b> pick from list &nbsp;·&nbsp; <b>Ctrl+Z</b> undo</div>
  <div id="results"></div>
</div>

<main>
  <section>
    <h2>Take one of these</h2>
    <div id="recs"></div>
    <h2 style="margin-top:22px">Sleepers <span style="color:var(--dim);font-weight:400;text-transform:none;letter-spacing:0">— value beating ADP</span></h2>
    <div id="sleepers"></div>
    <h2 style="margin-top:22px">Your roster</h2>
    <div id="roster" class="wdetail"></div>
  </section>

  <section>
    <h2>Recent trend</h2>
    <div id="trend" class="wdetail"></div>
    <h2 style="margin-top:18px">What waiting costs you</h2>
    <div id="waiting"></div>
  </section>
</main>

<div id="tabs"></div>
<div style="padding:0 22px 40px"><table id="board"></table></div>

<div id="flash"></div>

<script>
const POS = ["ALL","QB","RB","WR","TE","K","DST"];
let tab = "ALL", results = [], sel = 0;

const $ = s => document.querySelector(s);
const j = async (u,o) => (await fetch(u,o)).json();

function flash(msg){
  const f = $("#flash"); f.textContent = msg; f.classList.add("on");
  setTimeout(()=>f.classList.remove("on"), 1100);
}

function renderTrend(rt){
  if (!rt || !rt.window) return "no picks yet";
  const parts = rt.positions.map(p =>
    `<span class="${p.run?"runhot":""}">${p.pos}×${p.count}</span>`).join(" · ");
  const running = rt.positions.filter(p => p.run);
  const note = running.length
    ? `<div class="cliffnote">${running.map(p=>p.pos).join(", ")} run — `
      + `${running.map(p=>Math.round(p.share*100)+"%").join(", ")} of the last ${rt.window} picks</div>`
    : "";
  return `<div>${parts} <span style="color:var(--dim)">(last ${rt.window} picks)</span></div>${note}`;
}

function renderCategory(rows){
  if (!rows || !rows.length) return "";
  return rows.map(r => `
    <div class="catchip">
      <span class="cpos">${r.pos}</span>
      <span class="cname">${r.name}${injuryTag(r)}</span>
      <span class="cval">+${r.vor} vor</span>
    </div>`).join("");
}

function injuryTag(r){
  const s = r.injury_status;
  if (!s || s === "ACTIVE") return "";
  return ` <span style="color:var(--alarm)">${s}</span>`;
}

function renderSleepers(rows){
  if (!rows || !rows.length) return `<div class="wdetail">none right now</div>`;
  return rows.map(r => `
    <div class="rec">
      <span class="who">${r.name}</span>
      <span class="v num">R${r.value_round}</span>
      <span class="sub">${r.pos} · ${r.team??"FA"} · ADP round ${r.adp_round} (pick ~${r.adp_rank})${injuryTag(r)}</span>
      <span class="vlabel">plays like</span>
    </div>`).join("");
}

function renderState(s){
  $("#pickno").textContent = `#${s.pick}`;
  $("#turn").textContent = s.my_turn ? "You are on the clock"
                                     : `Slot ${s.on_clock_slot} picking`;
  $("#turn").classList.toggle("mine", s.my_turn);
  $("#clock").classList.toggle("mine", s.my_turn);
  $("#meta").textContent =
    `round ${s.round} · ${s.picks_until_me} pick${s.picks_until_me===1?"":"s"} until you`
    + ` · ${s.gap} players go before you pick`;

  $("#category").innerHTML = renderCategory(s.by_category);
  wirePickable("#category", ".catchip", s.by_category);

  $("#recs").innerHTML = s.recommend.map(r => `
    <div class="rec">
      <span class="who">${r.name}</span>
      <span class="v num">${r.vor>0?"+":""}${r.vor}</span>
      <span class="sub">${r.pos}${r.pos_rank??""} · ${r.team??"FA"} · bye ${r.bye??"–"}
        · tier ${r.tier??"–"} · ${r.proj_pts.toFixed(0)} proj${injuryTag(r)}</span>
      <span class="vlabel">over replacement</span>
    </div>`).join("");
  wirePickable("#recs", ".rec", s.recommend);

  $("#sleepers").innerHTML = renderSleepers(s.sleepers);
  wirePickable("#sleepers", ".rec", s.sleepers);

  $("#trend").innerHTML = renderTrend(s.recent_run);

  const max = Math.max(1, ...s.waiting.map(w=>w.cost));
  $("#waiting").innerHTML = s.waiting.map(w => `
    <div class="wait">
      <div class="wrow">
        <span class="wpos">${w.pos}</span>
        <span class="wcost" style="color:${w.cost>=max*0.6?"var(--alarm)":"var(--dim)"}">
          −${w.cost} pts</span>
      </div>
      <div class="bar ${w.cost>=max*0.6?"hot":""} ${w.tier_breaks?"cliff":""}"
           ${w.tier_breaks?`style="--x:1"`:""}>
        <i style="width:${Math.round(100*w.cost/max)}%"></i>
      </div>
      <div class="wdetail">${w.best_now} (${w.best_now_pts})
        → likely ${w.likely_later} (${w.likely_later_pts})</div>
      ${w.tier_breaks?`<div class="cliffnote">tier ends before your next turn</div>`:""}
    </div>`).join("");

  const need = Object.entries(s.needs).filter(([,v])=>v>0)
                     .map(([k,v])=>`${k}×${v}`).join(", ") || "starters filled";
  $("#roster").innerHTML = (s.roster.length
      ? s.roster.map(p=>`${p.pos} ${p.name}`).join(" · ")
      : "empty") + `<br><span style="color:var(--signal)">still need: ${need}</span>`;
}

function renderTabs(){
  $("#tabs").innerHTML = POS.map(p =>
    `<button class="${p===tab?"on":""}" data-p="${p}">${p}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b =>
    b.onclick = () => { tab = b.dataset.p; loadBoard(); renderTabs(); });
}

async function loadBoard(){
  const d = await j(`/api/board?pos=${tab}&limit=70`);
  let last = null;
  $("#board").innerHTML =
    `<tr><th>player</th><th>pos</th><th>team</th><th>bye</th>
         <th class="n">proj</th><th class="n">vor</th><th class="n">ecr</th>
         <th class="n">spread</th></tr>` +
    d.rows.map(r => {
      const brk = (tab!=="ALL" && last!==null && r.tier!==null && r.tier!==last);
      last = r.tier;
      return `<tr class="${brk?"tierbreak":""}">
        <td>${r.name}${injuryTag(r)}</td><td>${r.pos}</td><td>${r.team??"FA"}</td><td>${r.bye??"–"}</td>
        <td class="n">${r.proj_pts.toFixed(0)}</td>
        <td class="n">${r.vor>0?"+":""}${r.vor}</td>
        <td class="n">${r.ecr?.toFixed(1)??"–"}</td>
        <td class="n">${r.rank_min??"–"}–${r.rank_max??"–"}</td></tr>`;
    }).join("");
  wirePickable("#board", "tr:not(:first-child)", d.rows);
}

async function refresh(){ renderState(await j("/api/state")); loadBoard(); }

function renderResults(){
  $("#results").innerHTML = results.map((r,i) =>
    `<div class="${i===sel?"sel":""}" data-i="${i}">
       <span>${r.name}</span>
       <span class="num" style="color:var(--dim)">${r.pos} · ${r.team??"FA"}
         · ecr ${r.ecr?.toFixed(0)??"–"}</span></div>`).join("");
  $("#results").querySelectorAll("div").forEach(d =>
    d.onclick = (e) => { sel = +d.dataset.i; take(e.shiftKey ? "me" : "other"); });
}

let t;
$("#q").addEventListener("input", e => {
  clearTimeout(t);
  const v = e.target.value.trim();
  if (!v){ results=[]; renderResults(); return; }
  t = setTimeout(async () => {
    results = (await j(`/api/search?q=${encodeURIComponent(v)}`)).rows;
    sel = 0; renderResults();
  }, 60);
});

async function take(who, player){
  const r = player || results[sel];
  if (!r) return;
  renderState(await j("/api/pick", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({fpid:r.fpid, who})
  }));
  loadBoard();
  flash(who==="me" ? `You drafted ${r.name}` : `${r.name} off the board`);
  $("#q").value=""; results=[]; renderResults(); $("#q").focus();
}

// Wire click-to-pick onto any rendered list of player rows: plain click = someone
// else took him, shift+click = you did. `rows` must be in the same order the HTML
// was built from, so the i-th DOM element matches rows[i].
function wirePickable(containerSel, rowSel, rows){
  document.querySelectorAll(`${containerSel} ${rowSel}`).forEach((el, i) => {
    el.classList.add("pickable");
    el.onclick = (e) => take(e.shiftKey ? "me" : "other", rows[i]);
  });
}

document.addEventListener("keydown", async e => {
  if (e.key==="ArrowDown"){ sel=Math.min(sel+1,results.length-1); renderResults(); e.preventDefault(); }
  else if (e.key==="ArrowUp"){ sel=Math.max(sel-1,0); renderResults(); e.preventDefault(); }
  else if (e.key==="Enter"){ take(e.shiftKey?"me":"other"); e.preventDefault(); }
  else if (e.key==="z" && (e.ctrlKey||e.metaKey)){
    renderState(await j("/api/undo",{method:"POST"})); loadBoard();
    flash("Undid last pick"); e.preventDefault();
  }
  else if (document.activeElement !== $("#q") && e.key.length===1){ $("#q").focus(); }
});

renderTabs(); refresh(); $("#q").focus();
setInterval(refresh, 20000);
</script>
</body>
</html>
