<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This week</title>
<style>
:root {
  --bg: #f6f5f1; --card: #ffffff; --line: #e4e2da; --text: #1f1f1d; --muted: #6b6a64;
  --danger: #a32d2d; --danger-bg: #fcebeb; --warn: #854f0b; --warn-bg: #faeeda;
  --ok: #3b6d11; --ok-bg: #eaf3de; --accent: #185fa5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1b1a; --card: #242423; --line: #3a3a38; --text: #ecebe6; --muted: #a09f98;
    --danger: #f09595; --danger-bg: #3d1a1a; --warn: #fac775; --warn-bg: #3a2a10;
    --ok: #97c459; --ok-bg: #1f2e12; --accent: #85b7eb;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 16px; }
nav { display: flex; gap: 16px; align-items: center; border-bottom: 1px solid var(--line);
      padding-bottom: 10px; margin-bottom: 16px; font-size: 14px; }
nav .on { font-weight: 600; }
nav a { color: var(--muted); text-decoration: none; }
nav .right { margin-left: auto; display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 12px; }
button { font: inherit; font-size: 13px; background: transparent; color: var(--text);
         border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
button:hover { background: var(--card); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--card); border-radius: 10px; padding: 12px 14px; }
.stat .l { font-size: 12px; color: var(--muted); }
.stat .v { font-size: 24px; font-weight: 600; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
        padding: 12px 16px; margin-bottom: 12px; }
.card.danger { border-color: var(--danger); }
.card h2 { font-size: 14px; margin: 0 0 6px; font-weight: 600; }
.card.danger h2 { color: var(--danger); }
.card.warn h2 { color: var(--warn); }
.row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0;
       border-top: 1px solid var(--line); font-size: 14px; flex-wrap: wrap; }
.row:first-of-type { border-top: none; }
.m { color: var(--muted); font-size: 12px; }
.pill { font-size: 11px; padding: 1px 7px; border-radius: 6px; margin-left: 6px; white-space: nowrap; }
.pill.danger { background: var(--danger-bg); color: var(--danger); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.lock { background: var(--line); color: var(--muted); }
.empty { color: var(--muted); font-size: 14px; padding: 4px 0; }
.good { color: var(--ok); }
.err { background: var(--danger-bg); color: var(--danger); padding: 12px 16px; border-radius: 10px; }
</style>
</head>
<body>
<main>
  <nav>
    <span class="on">This week</span>
    <a href="/draft">Draft board</a>
    <span class="right"><span id="age"></span><button id="refresh">Refresh from ESPN</button></span>
  </nav>
  <div id="app"><p class="empty">Loading...</p></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pts = n => (n ?? 0).toFixed(1);
const rec = t => t ? `${t.wins}-${t.losses}${t.ties ? "-" + t.ties : ""}` : "";

function game(p) {
  if (!p.game) return "bye";
  const when = new Date(p.game.kickoff_ms).toLocaleString([], {weekday: "short", hour: "numeric", minute: "2-digit"});
  return `${p.game.home ? "vs" : "@"}${esc(p.game.opp)} · ${when}`;
}
function badges(p) {
  let b = "";
  if (p.injury && p.injury !== "ACTIVE") b += `<span class="pill danger">${esc(p.injury.replace("_", " ").toLowerCase())}</span>`;
  if (p.locked) b += `<span class="pill lock">locked</span>`;
  return b;
}
const who = p => `${esc(p.name)} <span class="m">${esc(p.pos)} · ${esc(p.team)}</span>${badges(p)}`;
function card(title, rows, empty, cls = "") {
  return `<section class="card ${cls}"><h2>${title}</h2>${rows.length ? rows.join("") : `<div class="empty">${empty}</div>`}</section>`;
}
const row = (left, right) => `<div class="row"><span>${left}</span><span class="m">${right}</span></div>`;

function render(d) {
  const gain = d.optimal_total - d.current_total;
  const stale = Object.values(d.data).some(x => x.source === "stale");
  const oldest = Math.min(...Object.values(d.data).map(x => x.fetched_at));
  $("#age").textContent = `ESPN data ${Math.round((Date.now() / 1000 - oldest) / 60)} min old${stale ? " (offline, showing saved copy)" : ""}`;

  let h = `<div class="stats">
    <div class="stat"><div class="l">Week ${d.week} · you (${rec(d.me)})</div><div class="v">${pts(d.current_total)}</div></div>
    <div class="stat"><div class="l">${d.opponent ? esc(d.opponent.name) + " (" + rec(d.opponent) + ")" : "No opponent"}</div><div class="v">${d.opponent_total == null ? "-" : pts(d.opponent_total)}</div></div>
    <div class="stat"><div class="l">Points left on bench</div><div class="v ${gain > 0.05 ? "" : "good"}">${pts(gain)}</div></div>
  </div>`;

  h += card("Fix first", d.problems.map(x => row(who(x.player), esc(x.message))),
    `<span class="good">All clear.</span>`, d.problems.length ? "danger" : "");

  h += card("IR moves", d.ir_moves.map(m =>
    row(who(m.player), `${m.from.toLowerCase()} &rarr; ${m.to.toLowerCase()} · ${esc(m.reason)}`)),
    "Nothing to move.");

  h += card("Lineup changes", d.deltas.map(x =>
    row(`Start ${who(x.in)}<br><span class="m">instead of ${esc(x.out.name)} (${pts(x.out.proj)})</span>`,
        `${esc(x.slot)} · ${pts(x.in.proj)} · <b class="good">+${pts(x.gain)}</b>`)),
    `<span class="good">None. Your lineup is already the best one.</span>`);

  h += card("Pickups", d.pickups.map(w =>
    row(`${who(w.add)} <span class="pill ${w.add.status === "WAIVERS" ? "warn" : "ok"}">${w.add.status === "WAIVERS" ? "waivers" : "free agent"}</span><br>
         <span class="m">${game(w.add)} · proj ${pts(w.add.proj)} · owned ${w.add.owned_change > 0 ? "+" : ""}${pts(w.add.owned_change)}% this week</span>`,
        `+${pts(w.gain)} this week · ${w.drop ? "drop " + esc(w.drop.name) : "no drop needed"}<br>rest of season ${w.ros_delta >= 0 ? "+" : ""}${pts(w.ros_delta)}`)),
    "No free agent would crack your lineup this week.");

  h += card(`Close calls (under ${d.constants.close_call_margin} pts)`, d.close_calls.map(c =>
    row(`${esc(c.slot)} · ${esc(c.starter.name)} ${pts(c.starter.proj)} over ${esc(c.alt.name)} ${pts(c.alt.proj)}`,
        `<span class="pill warn">${pts(c.margin)} pts</span> started ${pts(c.starter.started_pct)}% / ${pts(c.alt.started_pct)}%`)),
    "No start/sit decisions are close.", "warn");

  h += card("Your best lineup", d.starters.map(p =>
    row(`<span class="m">${esc(p.slot)}</span> ${who(p)}`, `${game(p)} · ${pts(p.proj)}`)), "");

  $("#app").innerHTML = h;
}

async function load(refresh) {
  $("#refresh").disabled = true;
  try {
    const r = await fetch("/api/season/week" + (refresh ? "?refresh=true" : ""));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);
    render(d);
  } catch (e) {
    $("#app").innerHTML = `<div class="err">${esc(e.message)}</div>`;
  } finally {
    $("#refresh").disabled = false;
  }
}
$("#refresh").onclick = () => load(true);
load(false);
</script>
</body>
</html>
